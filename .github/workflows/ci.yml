name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Lint
      run: pnpm --filter issue-status lint

    - name: Test
      run: pnpm --filter issue-status test

    - name: Build
      run: pnpm --filter issue-status build

    - name: Build CLI
      run: pnpm --filter issue-status build:cli
